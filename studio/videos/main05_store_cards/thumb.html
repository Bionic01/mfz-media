<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BC;font-weight:800;src:url("../../fonts/BarlowCondensed-ExtraBold.ttf")}
@font-face{font-family:BC;font-weight:700;src:url("../../fonts/BarlowCondensed-Bold.ttf")}
@font-face{font-family:B;font-weight:800;src:url("../../fonts/Barlow-ExtraBold.ttf")}
body{margin:0}
.wrap{width:1920px;height:1080px;position:relative;overflow:hidden;background:#121214 url(thumb_bg.png) center/cover;font-family:B}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,18,20,.92) 0%,rgba(18,18,20,.75) 45%,rgba(18,18,20,.15) 100%)}
.row{position:absolute;display:flex;gap:16px}
.tile{position:relative;width:180px;height:256px;border-radius:18px;background:linear-gradient(#2B2B30 0 50%,#202024 50% 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.tile b{font-family:BC;font-weight:800;font-size:214px;line-height:1;color:#FF5D5D}
.tile i{position:absolute;left:0;right:0;top:calc(50% - 3px);height:6px;background:#121214}
.tile.gap{width:30px;background:transparent;box-shadow:none}
.top{position:absolute;left:100px;top:96px;font-family:B;font-weight:800;font-size:60px;letter-spacing:3px;color:#F4EEDF}
.sub{position:absolute;left:100px;top:640px;font-family:BC;font-weight:800;font-size:170px;line-height:1;color:#F4EEDF}
.sub em{font-style:normal;color:#F7BE33}
.badge{position:absolute;right:90px;top:90px;background:#F7BE33;color:#121214;font-family:BC;font-weight:800;font-size:110px;line-height:1;padding:12px 40px 16px;border-radius:28px;transform:rotate(4deg);box-shadow:0 12px 30px rgba(0,0,0,.5);text-align:center}
.badge small{display:block;font-family:B;font-weight:800;font-size:36px;letter-spacing:2px}
.zero{position:absolute;right:110px;bottom:80px;display:flex;align-items:center;gap:22px;font-family:BC;font-weight:700;font-size:58px;color:#F4EEDF;text-shadow:0 4px 16px rgba(0,0,0,.7)}
.zero .tile{width:72px;height:100px;border-radius:10px}.zero .tile b{font-size:84px;color:#F7BE33}.zero .tile i{height:4px;top:calc(50% - 2px)}
</style></head><body><div class="wrap"><div class="shade"></div>
<div class="top">ALMOST</div>
<div class="row" style="left:90px;top:200px"><span class="tile"><b>R</b><i></i></span><span class="tile"><b>9</b><i></i></span><span class="tile gap"></span><span class="tile"><b>7</b><i></i></span><span class="tile"><b>5</b><i></i></span><span class="tile"><b>0</b><i></i></span></div>
<div class="sub">for a <em>R5 000</em> TV</div>
<div class="badge">BLACK FRIDAY<small>STORE-CARD TRAP</small></div>
<div class="zero"><span class="tile"><b>0</b><i></i></span>MONEY FROM ZERO</div>
</div></body></html>
